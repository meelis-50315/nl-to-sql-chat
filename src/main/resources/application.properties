spring.application.name=ecommerce

# Active database profile: "h2" (default - no local database install required,
# good for workshops) or "postgres" (if you want to run against a real Postgres).
# Override via --spring.profiles.active=postgres or the SPRING_PROFILES_ACTIVE env var
# instead of editing this file, if you prefer.
spring.profiles.active=h2

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway - {vendor} resolves automatically to "postgresql" or "h2" based on
# whichever datasource the active profile above configures.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Server
server.port=8080

# Google AI
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.options.response-mime-type=application/json
spring.ai.google.genai.chat.options.max-output-tokens=1024
