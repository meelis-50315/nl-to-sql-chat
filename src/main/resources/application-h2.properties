# DataSource - H2 (file-based, no local database install required)
spring.datasource.url=jdbc:h2:file:./data/ecommerce_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 web console - http://localhost:8080/h2-console (JDBC URL above, user "sa", empty password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# NL-to-SQL prompt dialect
nlsql.dialect=H2
